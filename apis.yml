name: Fundable
description: >-
  Fundable is a software-as-a-service fundraising platform for startups, operated as part of the
  Startups.com family and surfaced in the API Evangelist network as a portfolio lead of 500 Global.
  Fundable helps founders start and manage a professional raise to attract accredited investors,
  providing a secure investor data room, investor browsing and discovery tools, and email outreach
  templates across Self-Managed and Funding Accelerator Premium tiers. The platform reports more than
  $700 million in funding commitments across 20,000+ accredited investors. Fundable is not a registered
  broker-dealer and does not execute securities transactions or offer investment advice. As of this
  enrichment pass Fundable publishes no public API, developer portal, SDKs, or machine-readable
  specification, so this profile captures company identity, published policy/support surfaces, and a
  probed domain-security posture rather than API artifacts.
